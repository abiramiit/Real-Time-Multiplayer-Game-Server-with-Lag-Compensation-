version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    depends_on:
      - redis

  backend-secondary:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8080
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
